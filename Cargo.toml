[package]
name = "mdungeons"
version = "0.1.0"
edition = "2021"
description = "Fan-made dungeon crawler inspired by Minecraft Dungeons — private use only"
license = "MIT"

[dependencies]
wgpu = "=25.0.2"
winit = "0.30.13"
glam = "0.29.0"
hecs = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8.5"
ab_glyph = "0.2.32"
bytemuck = { version = "1", features = ["derive"] }
gilrs = "0.11.2"
pollster = "0.4"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
